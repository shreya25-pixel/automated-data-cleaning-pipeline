name: Automated Data Cleaning

on:
  push:
    branches:
      - main
    paths:
      - "data/raw/**"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/**"

  workflow_dispatch:

jobs:

  clean-data:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # Run data cleaning
      # --------------------------------------------------

      - name: Run CSV data cleaning
        run: |
          python src/clean_data.py

      # --------------------------------------------------
      # Run tests
      # --------------------------------------------------

      - name: Run tests
        run: |
          pytest
