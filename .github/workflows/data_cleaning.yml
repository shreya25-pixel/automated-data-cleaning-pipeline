name: Automated Data Cleaning

on:
  push:
    branches:
      - main
    paths:
      - "data/raw/**"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/**"

  workflow_dispatch:

jobs:

  clean-data:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # Run data cleaning
      # --------------------------------------------------

      - name: Run CSV data cleaning
        run: |
          python src/clean_data.py

      # --------------------------------------------------
      # Run data quality tests
      # --------------------------------------------------

      - name: Run tests
        run: |
          pytest

      # --------------------------------------------------
      # Upload cleaned files to GitHub repository
      # --------------------------------------------------

      - name: Commit cleaned data
        run: |

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cleaned/

          if git diff --cached --quiet; then
            echo "No cleaned data changes to commit."
          else
            git commit -m "Automated: update cleaned datasets"
            git push
          fi
