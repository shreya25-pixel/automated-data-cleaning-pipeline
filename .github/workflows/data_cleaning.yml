name: Automated Data Cleaning

on:
  push:
    branches:
      - main
    paths:
      - "data/raw/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-data:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run data cleaning
      - name: Run CSV data cleaning
        run: |
          python src/clean_data.py

      # 5. Run tests
      - name: Run tests
        run: |
          pytest

      # 6. Check generated files
      - name: Check cleaned files
        run: |
          echo "Cleaned files:"
          ls -lah data/cleaned/

      # 7. Commit cleaned data
      - name: Commit cleaned data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cleaned/

          if git diff --cached --quiet; then
            echo "No cleaned data changes to commit."
          else
            git commit -m "Automated: update cleaned datasets"
            git push
          fi
